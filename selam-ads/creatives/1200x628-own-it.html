<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:628px;overflow:hidden}
  .ad{width:1200px;height:628px;position:relative;
    background:radial-gradient(760px 560px at 86% 20%, #1b2344 0%, #0c1024 46%, #05060c 100%);
    font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;color:#f2f4fb;overflow:hidden}
  .brand{position:absolute;top:40px;left:52px;display:flex;align-items:center;gap:13px}
  .brand img{width:40px;height:40px;border-radius:10px}
  .brand .wm{font-size:23px;font-weight:700;letter-spacing:.14em}
  .portrait{position:absolute;right:0;bottom:0;width:470px;height:628px;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
  .portrait img{width:100%;height:100%;object-fit:cover;object-position:56% 20%}
  .copy{position:absolute;left:52px;top:150px;width:720px}
  .eyebrow{font-size:16px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#8aa4ea;margin-bottom:18px}
  h1{font-size:68px;line-height:1.0;font-weight:800;letter-spacing:-.02em}
  h1 .g{color:#7be3a4}
  .sub{font-size:23px;line-height:1.35;color:#b6bbd2;margin-top:20px;max-width:560px;font-weight:500}
  .cta{position:absolute;left:52px;bottom:52px;display:flex;align-items:center;gap:18px}
  .pill{background:linear-gradient(135deg,#8aa4ea,#617ECC);color:#07091a;font-size:22px;font-weight:800;padding:15px 30px;border-radius:999px}
  .url{font-size:21px;color:#f2f4fb;font-weight:600}
</style></head><body>
  <div class="ad">
    <div class="portrait"><img src="assets/char-selam.jpg" alt=""></div>
    <div class="brand"><img src="assets/selam-mark-180.png" alt=""><span class="wm">SELAM</span></div>
    <div class="copy">
      <div class="eyebrow">Private AI Operator for Mac</div>
      <h1>Own her.<br>Don't <span class="g">rent</span> a chatbot.</h1>
      <div class="sub">A real AI operator that lives on your Mac — private, yours to keep, no $200/mo cloud.</div>
    </div>
    <div class="cta"><span class="pill">Start free</span><span class="url">heyselam.ai</span></div>
  </div>
</body></html>
