<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;overflow:hidden}
  .ad{width:1080px;height:1080px;position:relative;
    background:radial-gradient(1100px 720px at 78% 8%, #1b2344 0%, #0c1024 42%, #05060c 100%);
    font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;color:#f2f4fb;overflow:hidden}
  .glow{position:absolute;width:760px;height:760px;right:-160px;top:-180px;border-radius:50%;
    background:radial-gradient(circle,#8aa4ea55,transparent 62%);filter:blur(10px)}
  .brand{position:absolute;top:56px;left:64px;display:flex;align-items:center;gap:16px}
  .brand img{width:52px;height:52px;border-radius:12px}
  .brand .wm{font-size:30px;font-weight:700;letter-spacing:.14em}
  .portrait{position:absolute;right:-30px;bottom:0;width:560px;height:760px;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 24%);mask-image:linear-gradient(90deg,transparent,#000 24%)}
  .portrait img{width:100%;height:100%;object-fit:cover;object-position:60% 22%}
  .copy{position:absolute;left:64px;top:300px;width:620px}
  .eyebrow{font-size:21px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#8aa4ea;margin-bottom:26px}
  h1{font-size:98px;line-height:.98;font-weight:800;letter-spacing:-.02em}
  h1 .g{color:#7be3a4}
  .sub{font-size:30px;line-height:1.35;color:#b6bbd2;margin-top:30px;max-width:540px;font-weight:500}
  .cta{position:absolute;left:64px;bottom:84px;display:flex;align-items:center;gap:22px}
  .pill{background:linear-gradient(135deg,#8aa4ea,#617ECC);color:#07091a;font-size:28px;font-weight:800;
    padding:20px 36px;border-radius:999px;letter-spacing:.01em}
  .url{font-size:26px;color:#f2f4fb;font-weight:600;letter-spacing:.02em}
  .chips{position:absolute;left:64px;top:244px;font-size:20px;color:#7d829e;letter-spacing:.06em;font-weight:600}
</style></head><body>
  <div class="ad">
    <div class="glow"></div>
    <div class="portrait"><img src="assets/char-selam.jpg" alt=""></div>
    <div class="brand"><img src="assets/selam-mark-180.png" alt=""><span class="wm">SELAM</span></div>
    <div class="chips">● AUTONOMOUS · LOCAL · PRIVATE</div>
    <div class="copy">
      <div class="eyebrow">AI Operator for your Mac</div>
      <h1>Runs ops<br>while you<br><span class="g">sleep.</span></h1>
      <div class="sub">She plans the work, delegates to her own agents, and reports back by morning.</div>
    </div>
    <div class="cta"><span class="pill">Start free</span><span class="url">heyselam.ai</span></div>
  </div>
</body></html>
