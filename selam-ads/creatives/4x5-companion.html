<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  .ad{width:1080px;height:1350px;position:relative;
    background:radial-gradient(1000px 820px at 82% 10%, #1b2344 0%, #0c1024 44%, #05060c 100%);
    font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;color:#f2f4fb;overflow:hidden}
  .brand{position:absolute;top:72px;left:68px;display:flex;align-items:center;gap:16px;z-index:3}
  .brand img{width:54px;height:54px;border-radius:13px}
  .brand .wm{font-size:31px;font-weight:700;letter-spacing:.14em}
  .portrait{position:absolute;right:-20px;bottom:0;width:600px;height:1180px;overflow:hidden;
    -webkit-mask-image:linear-gradient(100deg,transparent,#000 30%);mask-image:linear-gradient(100deg,transparent,#000 30%)}
  .portrait img{width:100%;height:100%;object-fit:cover;object-position:58% 16%}
  .copy{position:absolute;left:68px;top:366px;width:560px;z-index:3}
  .eyebrow{font-size:22px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#8aa4ea;margin-bottom:26px}
  h1{font-size:86px;line-height:1.0;font-weight:800;letter-spacing:-.02em}
  h1 .g{color:#7be3a4}
  .sub{font-size:31px;line-height:1.38;color:#c6cbe0;margin-top:34px;max-width:500px;font-weight:500}
  .cta{position:absolute;left:68px;bottom:96px;display:flex;align-items:center;gap:22px;z-index:3}
  .pill{background:linear-gradient(135deg,#8aa4ea,#617ECC);color:#07091a;font-size:31px;font-weight:800;padding:22px 42px;border-radius:999px}
  .url{font-size:29px;color:#f2f4fb;font-weight:600}
</style></head><body>
  <div class="ad">
    <div class="portrait"><img src="assets/char-selam.jpg" alt=""></div>
    <div class="brand"><img src="assets/selam-mark-180.png" alt=""><span class="wm">SELAM</span></div>
    <div class="copy">
      <div class="eyebrow">Your AI, personified</div>
      <h1>A face.<br>A voice.<br>A <span class="g">name</span><br>you choose.</h1>
      <div class="sub">Meet Selam — she remembers you, knows your face, and feels like a teammate.</div>
    </div>
    <div class="cta"><span class="pill">Meet her free</span><span class="url">heyselam.ai</span></div>
  </div>
</body></html>
