<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;overflow:hidden}
  .ad{width:1080px;height:1080px;position:relative;
    background:radial-gradient(1100px 720px at 78% 8%, #1b2344 0%, #0c1024 42%, #05060c 100%);
    font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;color:#f2f4fb;overflow:hidden}
  .brand{position:absolute;top:56px;left:64px;display:flex;align-items:center;gap:16px}
  .brand img{width:52px;height:52px;border-radius:12px}
  .brand .wm{font-size:30px;font-weight:700;letter-spacing:.14em}
  .live{position:absolute;top:58px;right:64px;display:flex;align-items:center;gap:11px;background:#e5484d;
    padding:12px 22px 12px 18px;border-radius:999px;font-weight:800;font-size:24px;letter-spacing:.08em;box-shadow:0 8px 30px rgba(229,72,77,.45)}
  .live .d{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.3)}
  .portrait{position:absolute;right:-30px;bottom:0;width:560px;height:770px;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 24%);mask-image:linear-gradient(90deg,transparent,#000 24%)}
  .portrait img{width:100%;height:100%;object-fit:cover;object-position:60% 22%}
  .copy{position:absolute;left:64px;top:300px;width:640px}
  .eyebrow{font-size:21px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#8aa4ea;margin-bottom:26px}
  h1{font-size:92px;line-height:.98;font-weight:800;letter-spacing:-.02em}
  h1 .g{color:#7be3a4}
  .sub{font-size:29px;line-height:1.35;color:#b6bbd2;margin-top:28px;max-width:540px;font-weight:500}
  .cta{position:absolute;left:64px;bottom:80px;display:flex;align-items:center;gap:22px}
  .pill{background:linear-gradient(135deg,#8aa4ea,#617ECC);color:#07091a;font-size:28px;font-weight:800;padding:20px 36px;border-radius:999px}
  .url{font-size:28px;color:#f2f4fb;font-weight:700;letter-spacing:.01em}
</style></head><body>
  <div class="ad">
    <div class="portrait"><img src="assets/char-selam.jpg" alt=""></div>
    <div class="brand"><img src="assets/selam-mark-180.png" alt=""><span class="wm">SELAM</span></div>
    <div class="live"><span class="d"></span>LIVE NOW</div>
    <div class="copy">
      <div class="eyebrow">An AI, hosting live</div>
      <h1>She's live.<br>Ask her<br><span class="g">anything.</span></h1>
      <div class="sub">Watch Selam host a real show — reacting to your comments in real time.</div>
    </div>
    <div class="cta"><span class="pill">Watch now</span><span class="url">heyselam.ai/yt</span></div>
  </div>
</body></html>
