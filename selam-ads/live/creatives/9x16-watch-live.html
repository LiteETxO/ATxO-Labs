<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  .ad{width:1080px;height:1920px;position:relative;
    background:radial-gradient(1200px 900px at 50% 4%, #1b2344 0%, #0c1024 44%, #05060c 100%);
    font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;color:#f2f4fb;overflow:hidden}
  .brand{position:absolute;top:92px;left:72px;display:flex;align-items:center;gap:18px}
  .brand img{width:58px;height:58px;border-radius:14px}
  .brand .wm{font-size:34px;font-weight:700;letter-spacing:.14em}
  .live{position:absolute;top:94px;right:72px;display:flex;align-items:center;gap:13px;background:#e5484d;
    padding:15px 28px 15px 22px;border-radius:999px;font-weight:800;font-size:30px;letter-spacing:.08em;box-shadow:0 8px 34px rgba(229,72,77,.5)}
  .live .d{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.3)}
  .portrait{position:absolute;left:0;right:0;bottom:0;height:1180px;overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 26%);mask-image:linear-gradient(180deg,transparent,#000 26%)}
  .portrait img{width:100%;height:100%;object-fit:cover;object-position:52% 16%}
  .scrim{position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(180deg,transparent,#05060c 72%)}
  .copy{position:absolute;left:72px;top:420px;width:940px}
  .eyebrow{font-size:28px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#8aa4ea;margin-bottom:30px}
  h1{font-size:140px;line-height:.95;font-weight:800;letter-spacing:-.02em}
  h1 .g{color:#7be3a4}
  .sub{font-size:40px;line-height:1.35;color:#c6cbe0;margin-top:40px;max-width:840px;font-weight:500}
  .cta{position:absolute;left:72px;bottom:120px;display:flex;align-items:center;gap:28px}
  .pill{background:linear-gradient(135deg,#8aa4ea,#617ECC);color:#07091a;font-size:38px;font-weight:800;padding:26px 52px;border-radius:999px}
  .url{font-size:38px;color:#f2f4fb;font-weight:700}
</style></head><body>
  <div class="ad">
    <div class="portrait"><img src="assets/char-selam.jpg" alt=""></div>
    <div class="scrim"></div>
    <div class="brand"><img src="assets/selam-mark-180.png" alt=""><span class="wm">SELAM</span></div>
    <div class="live"><span class="d"></span>LIVE</div>
    <div class="copy">
      <div class="eyebrow">An AI, hosting live</div>
      <h1>She's live.<br>Ask her<br><span class="g">anything.</span></h1>
      <div class="sub">Watch Selam host — reacting to your comments in real time.</div>
    </div>
    <div class="cta"><span class="pill">Watch now</span><span class="url">heyselam.ai/yt</span></div>
  </div>
</body></html>
